
<head>
    <!-- Кодировка -->
    <meta charset="UTF-8">

    <!-- Адаптация под мобильные устройства -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <!-- Название сайта -->
    <title>КЛЁН — инструкция по сборке слайдера</title>

    <!-- Описание сайта -->
    <meta
        name="description"
        content="Соберите слайдер для камеры своими руками. Комплектующие, ссылки на детали, пошаговая инструкция по сборке и аренда слайдера."
    >

    <!-- Автоматическая поддержка светлой и тёмной тем -->
    <meta
        name="color-scheme"
        content="light dark"
    >

    <!-- Цвет интерфейса браузера -->
    <meta
        name="theme-color"
        content="#ffffff"
        media="(prefers-color-scheme: light)"
    >

    <meta
        name="theme-color"
        content="#111315"
        media="(prefers-color-scheme: dark)"
    >

    <!-- Иконка сайта -->
    <link
        rel="icon"
        type="image/svg+xml"
        href="./favicon.svg"
    >

    <!-- Основные стили -->
    <link
        rel="stylesheet"
        href="./style.css"
    >

    <!-- Адаптивные стили и тёмная тема -->
    <link
        rel="stylesheet"
        href="./responsive.css"
    >
</head>
